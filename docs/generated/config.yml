config-version: 1
# Compaction, content verification, checkpointing and sealing run after capture drains.
maintenance-enabled: true
# Delay between cycles; unfinished steps resume after draining. Units: ms, s, m, h, d.
maintenance-interval: 60s
# Row work per incremental step and retired files per sweep, not performance promises.
maintenance-max-input-rows: 100000
maintenance-max-shards: 8
# Cooperative deadline. OS disk stalls cannot be interrupted by this budget.
maintenance-budget: 50ms
# Zero disables retention. A positive age explicitly enables history removal.
# Removed history creates refusal gaps; this is not secure identity erasure.
retention-age: 0ms
