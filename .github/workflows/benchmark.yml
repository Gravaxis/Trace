name: Benchmark

on:
  pull_request:
    paths:
      - "benchmarks/**"
      - "trace-core/**"
      - "trace-storage-**/**"
      - "trace-paper/src/main/java/in/gravaxis/trace/**"
      - "build-logic/**"
      - "gradle/libs.versions.toml"
  workflow_dispatch:
  schedule:
    # Weekly, so a regression that nobody's pull request touched still surfaces.
    - cron: "43 3 * * 1"

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  allocation-gate:
    name: Allocation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # Gate P1 in both of its forms: the exact per-thread byte count (authoritative, and run again
      # with escape analysis disabled) and JMH's profiler. See ADR-0009.
      - name: Exact allocation tests and JMH gate
        run: ./gradlew :benchmarks:check :benchmarks:checkAllocationGate --stacktrace

      - name: Upload JMH output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jmh-results
          path: benchmarks/build/jmh/*.json
          if-no-files-found: warn

  readme-table:
    name: README table is generated, not typed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify the README table against the newest committed results
        run: ./gradlew :benchmarks:verifyReadmeTable --stacktrace

  full-run:
    name: Full benchmark run
    # Boots real servers and kills them; too slow for every pull request, so it runs on demand and
    # on the weekly schedule. Results are uploaded, never committed from CI: a number in the
    # repository should come from a machine someone can name.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Cache pinned server jars
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/trace-servers
          key: trace-servers-${{ hashFiles('gradle/servers.properties') }}

      - name: Run every benchmark and the crash rig
        run: ./gradlew benchmark -Ptrace.crash.iterations=3 --stacktrace

      - name: Upload the results directory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmarks/results/**
          if-no-files-found: error
